<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupplyPilot Volvo Industrial Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#0b0f1a;
--card:#1a2035;
--card2:#111827;
--text:#ffffff;
--muted:#aab3c5;
--accent:#10b981;
--border:rgba(255,255,255,0.08);
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial, sans-serif;
}

.container{
padding:24px;
max-width:1500px;
margin:auto;
}

h1{margin-bottom:6px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
margin-bottom:16px;
}

.card{
background:var(--card);
border-radius:14px;
padding:18px;
border:1px solid var(--border);
}

.kpi-label{
font-size:12px;
text-transform:uppercase;
color:var(--muted);
}

.kpi-value{
font-size:28px;
font-weight:700;
margin-top:4px;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:16px;
}

input,select,button{
background:var(--card2);
border:1px solid var(--border);
color:white;
padding:8px 10px;
border-radius:8px;
}

button{cursor:pointer}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th,td{
padding:8px;
border-bottom:1px solid var(--border);
}

th{
cursor:pointer;
background:var(--card);
}

.badge{
padding:3px 6px;
border-radius:6px;
font-size:12px;
}

.A{background:#10b98133;color:#10b981}
.B{background:#f59e0b33;color:#f59e0b}
.C{background:#3b82f633;color:#3b82f6}

.alertCrit{background:#ef444433;color:#ef4444}
.alertWarn{background:#f59e0b33;color:#f59e0b}
.alertOK{background:#10b98133;color:#10b981}

canvas{height:300px!important}

</style>
</head>

<body>

<div class="container">

<h1>SupplyPilot Volvo Supply Chain Dashboard</h1>

<div class="controls">
<button onclick="loadData()">Recharger données</button>
<input type="file" id="excelFile">
<input id="search" placeholder="Recherche pièce...">
<select id="abcFilter">
<option value="ALL">Toutes ABC</option>
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>

<div class="grid">
<div class="card">
<div class="kpi-label">SKU</div>
<div class="kpi-value" id="kpiSku">0</div>
</div>

<div class="card">
<div class="kpi-label">Valeur inventaire</div>
<div class="kpi-value" id="kpiInv">0</div>
</div>

<div class="card">
<div class="kpi-label">Valeur annuelle</div>
<div class="kpi-value" id="kpiAnnual">0</div>
</div>

<div class="card">
<div class="kpi-label">Alertes critiques</div>
<div class="kpi-value" id="kpiAlert">0</div>
</div>
</div>

<div class="grid">
<div class="card"><canvas id="chartABC"></canvas></div>
<div class="card"><canvas id="chartValue"></canvas></div>
</div>

<div class="card">

<table id="table">
<thead>
<tr>
<th>SKU</th>
<th>Description</th>
<th>Famille</th>
<th>Demand</th>
<th>Prix</th>
<th>Stock</th>
<th>Valeur inventaire</th>
<th>Valeur annuelle</th>
<th>ABC</th>
<th>Alerte</th>
</tr>
</thead>

<tbody></tbody>
</table>

</div>

</div>

<script>

let rows=[]

async function loadData(){

const res = await fetch("./volvo_supply_chain_400.json")
rows = await res.json()

render()

}

function render(){

const tbody=document.querySelector("#table tbody")
tbody.innerHTML=""

let inv=0
let annual=0
let alert=0

rows.forEach(r=>{

inv+=r.ValeurInventaire
annual+=r.ValeurAnnuelle
if(r.AlerteStock=="Critique")alert++

tbody.innerHTML+=`
<tr>
<td>${r.SKU}</td>
<td>${r.Description}</td>
<td>${r.Famille}</td>
<td>${r.Demand}</td>
<td>${r.PrixPiece}</td>
<td>${r.Stock}</td>
<td>${r.ValeurInventaire}</td>
<td>${r.ValeurAnnuelle}</td>
<td><span class="badge ${r.ABC}">${r.ABC}</span></td>
<td>${renderAlert(r.AlerteStock)}</td>
</tr>
`

})

document.getElementById("kpiSku").innerText=rows.length
document.getElementById("kpiInv").innerText=Math.round(inv)
document.getElementById("kpiAnnual").innerText=Math.round(annual)
document.getElementById("kpiAlert").innerText=alert

renderCharts()

}

function renderAlert(v){

if(v=="Critique")return '<span class="badge alertCrit">Critique</span>'
if(v=="A surveiller")return '<span class="badge alertWarn">Surveiller</span>'
return '<span class="badge alertOK">OK</span>'

}

function renderCharts(){

let abc={A:0,B:0,C:0}

rows.forEach(r=>abc[r.ABC]++)

new Chart(document.getElementById("chartABC"),{
type:"doughnut",
data:{
labels:["A","B","C"],
datasets:[{
data:[abc.A,abc.B,abc.C],
backgroundColor:["#10b981","#f59e0b","#3b82f6"]
}]
}
})

let sorted=[...rows].sort((a,b)=>b.ValeurAnnuelle-a.ValeurAnnuelle).slice(0,10)

new Chart(document.getElementById("chartValue"),{
type:"bar",
data:{
labels:sorted.map(r=>r.SKU),
datasets:[{
label:"Valeur annuelle",
data:sorted.map(r=>r.ValeurAnnuelle),
backgroundColor:"#10b981"
}]
}
})

}

loadData()

</script>

</body>
</html>
